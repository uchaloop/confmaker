<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-label="confmaker">
  <title>confmaker</title>

  <!-- The mark: a struct's braces holding an environment value. -->
  <rect x="24" y="24" width="132" height="132" rx="30" fill="none" stroke="#00ADD8" stroke-width="6"/>
  <text x="90" y="90"
        text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace"
        font-size="58" font-weight="600" fill="#00ADD8">{$}</text>

  <text x="192" y="84"
        dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace"
        font-size="52" font-weight="600" fill="#00ADD8">confmaker</text>

  <text x="194" y="128"
        dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="21" fill="#7D8590">typed configuration from the environment</text>
</svg>
