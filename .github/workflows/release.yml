name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the previous tag can be found for the
          # comparison link.
          fetch-depth: 0

      - name: Validate the module version tag
        run: |
          # This module uses /v2, so release tags must use major version 2.
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          pattern="^v2\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $pattern ]]; then
            echo "Invalid module version tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"

          awk -v v="$version" '
            $1 == "##" && $2 == "[" v "]" { found = 1; next }
            found && /^## / { exit }
            found
          ' CHANGELOG.md > notes.md

          # A tag whose version is still filed under Unreleased would publish an
          # empty release. Say so instead.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

          # Ignore historical nested-module tags when finding the previous release.
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$previous" "${GITHUB_REF_NAME}" >> notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag)

          # GitHub prerelease status follows the version's prerelease suffix.
          case "${GITHUB_REF_NAME}" in
            v*-*) args+=(--prerelease --latest=false) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" "${args[@]}"

  go-proxy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the released version from the Go proxy
        env:
          MODULE: github.com/uchaloop/confmaker/v2
        run: |
          curl --fail --show-error --silent \
            --retry 4 --retry-all-errors --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 10 --max-time 30 \
            "https://proxy.golang.org/${MODULE}/@v/${GITHUB_REF_NAME}.info"
