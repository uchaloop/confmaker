name: CI

on:
  push:
    branches:
      - main
      - 'release/**'

  pull_request:
    branches:
      - main
      - 'release/**'

  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module dependencies
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        timeout-minutes: 2
        continue-on-error: true
        with:
          files: ./coverage.out
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  secret-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: integration/secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Resolve integration dependencies
        run: go mod tidy
      - name: Vet integration
        run: go vet ./...
      - name: Test integration
        run: go test -race ./...

  engine-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: examples/engines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: examples/engines/go.sum
      - name: Check module dependencies
        run: go mod tidy -diff
      - name: Build examples
        run: go build ./...
      - name: Vet examples
        run: go vet ./...
      - name: Test examples
        run: go test -race ./...
