name: Release confx

# Tags of the nested module github.com/uchaloop/confmaker/confx: confx/vX.Y.Z.
on:
  push:
    tags:
      - "confx/v*"

permissions:
  contents: read

jobs:
  # The adapter as users get it: its own go.mod, no workspace, the core release
  # it requires.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: confx
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: confx/go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  pkg-go-dev:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pkg.go.dev to index the release
        env:
          MODULE: github.com/uchaloop/confmaker/confx
        run: |
          # The proxy knows the version without the module's directory prefix.
          version="${GITHUB_REF_NAME#confx/}"
          curl -fsS "https://proxy.golang.org/${MODULE}/@v/${version}.info"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the previous tag can be found for the
          # comparison link.
          fetch-depth: 0

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#confx/v}"

          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found
          ' confx/CHANGELOG.md > notes.md

          # A tag whose version is still filed under Unreleased would publish an
          # empty release. Say so instead.
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "confx/CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

          # Only this module's tags: the core's v* tags are a different history.
          previous="$(git describe --tags --abbrev=0 --match 'confx/v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: %s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$previous" "${GITHUB_REF_NAME}" >> notes.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag)

          # Everything before 1.0 is published as a pre-release: the API is still
          # allowed to break between minors.
          case "${GITHUB_REF_NAME}" in
            confx/v0.*) args+=(--prerelease) ;;
          esac

          gh release create "${GITHUB_REF_NAME}" "${args[@]}"
